<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Terminal card about Adarsh" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="l1"><rect x="0" y="0" width="0" height="40"><animate attributeName="width" from="0" to="960" begin="0.4s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="0" width="0" height="40"><animate attributeName="width" from="0" to="960" begin="1.9s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="0" width="0" height="40"><animate attributeName="width" from="0" to="960" begin="3.4s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="0" width="0" height="40"><animate attributeName="width" from="0" to="960" begin="5.1s" dur="1.4s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .t{font-family:Consolas,Menlo,'Courier New',monospace;font-size:17px}
    .p{fill:#00e676}.c{fill:#e6edff}.k{fill:#82aaff}.v{fill:#ffcb6b}.d{fill:#6b7ba8}
  </style>

  <rect width="1000" height="330" rx="14" fill="#0d1224" stroke="#26335c"/>
  <rect width="1000" height="38" rx="14" fill="#161d38"/>
  <rect y="24" width="1000" height="14" fill="#161d38"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="19" r="6" fill="#27c93f"/>
  <text x="500" y="24" text-anchor="middle" class="t d" font-size="14">adarsh@dev: ~</text>

  <g transform="translate(24,62)">
    <g clip-path="url(#l1)">
      <text class="t" y="22"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
    </g>
    <g clip-path="url(#l1)" transform="translate(0,26)">
      <text class="t" y="22"><tspan class="d">→ </tspan><tspan class="v">Software Engineer @ Bank of America · Mumbai</tspan></text>
    </g>
  </g>

  <g transform="translate(24,126)">
    <g clip-path="url(#l2)">
      <text class="t" y="22"><tspan class="p">$ </tspan><tspan class="c">cat focus.txt</tspan></text>
    </g>
    <g clip-path="url(#l2)" transform="translate(0,26)">
      <text class="t" y="22"><tspan class="d">→ </tspan><tspan class="k">containers · kubernetes · ci/cd · observability · resilient apis</tspan></text>
    </g>
  </g>

  <g transform="translate(24,190)">
    <g clip-path="url(#l3)">
      <text class="t" y="22"><tspan class="p">$ </tspan><tspan class="c">ls ~/products | wc -l</tspan></text>
    </g>
    <g clip-path="url(#l3)" transform="translate(0,26)">
      <text class="t" y="22"><tspan class="d">→ </tspan><tspan class="v">6+ products shipped end-to-end as sole engineer</tspan></text>
    </g>
  </g>

  <g transform="translate(24,254)">
    <g clip-path="url(#l4)">
      <text class="t" y="22"><tspan class="p">$ </tspan><tspan class="c">./current_status.sh</tspan></text>
    </g>
    <g clip-path="url(#l4)" transform="translate(0,26)">
      <text class="t" y="22"><tspan class="d">→ </tspan><tspan class="k">building: </tspan><tspan class="v">reliable, observable, cloud-native systems</tspan></text>
    </g>
    <rect x="610" y="30" width="10" height="20" fill="#00e676" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
