<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="3" width="1000" height="2" rx="1" fill="#1d2a4a"/>
  <rect y="2" width="220" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="x" from="-220" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
