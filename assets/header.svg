<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Adarsh Kumar Dubey - Forward Deployed Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111a35"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.45"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.5"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#ff4081" stop-opacity="0.35"/><stop offset="1" stop-color="#ff4081" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d2a4a" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)" opacity="0.6"/>

    <!-- drifting glow orbs -->
    <circle cx="150" cy="80" r="170" fill="url(#orbA)">
      <animate attributeName="cx" values="150;260;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="220" r="190" fill="url(#orbB)">
      <animate attributeName="cx" values="520;430;520" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="70" r="170" fill="url(#orbC)">
      <animate attributeName="cy" values="70;160;70" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- floating code glyphs -->
    <g font-family="Consolas, Menlo, monospace" font-size="22" fill="#5c7cfa" opacity="0.35">
      <text x="70" y="230">{ }<animate attributeName="y" values="230;200;230" dur="6s" repeatCount="indefinite"/></text>
      <text x="260" y="60">&lt;/&gt;<animate attributeName="y" values="60;85;60" dur="7s" repeatCount="indefinite"/></text>
      <text x="720" y="240">k8s<animate attributeName="y" values="240;212;240" dur="8s" repeatCount="indefinite"/></text>
      <text x="880" y="215">01<animate attributeName="y" values="215;240;215" dur="5s" repeatCount="indefinite"/></text>
      <text x="610" y="50">λ<animate attributeName="y" values="50;75;50" dur="6.5s" repeatCount="indefinite"/></text>
      <text x="40" y="60">git<animate attributeName="y" values="60;40;60" dur="7.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- greeting -->
    <text x="500" y="92" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" fill="#8fa3d9" opacity="0">
      &gt; hello, world. i'm
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.8s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="500" y="158" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#name)" opacity="0">
      Adarsh Kumar Dubey
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="0.6s" dur="1s" fill="freeze"/>
    </text>

    <!-- rotating roles -->
    <g font-family="Consolas, Menlo, monospace" font-size="24" text-anchor="middle" fill="#e6edff">
      <text x="500" y="208" opacity="0">Forward Deployed Engineer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
      <text x="500" y="208" opacity="0">Java · Spring Boot · Microservices
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
      <text x="500" y="208" opacity="0">Kubernetes · OpenShift · CI/CD
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
      <text x="500" y="208" opacity="0">Applied AI · RAG · LangChain
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
    </g>

    <!-- live indicator -->
    <g font-family="Consolas, Menlo, monospace" font-size="14" fill="#8fa3d9">
      <circle cx="40" cy="246" r="5" fill="#00e676">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;7;5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="251">Open to build, ship and scale</text>
    </g>
  </g>
</svg>
